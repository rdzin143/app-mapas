<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Biblioteca das 120 fichas de anatomia palpatória, com busca, filtros, favoritos e progresso de estudo.">
<style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Mapas de Anatomia Palpatória</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra fixa de busca e progresso, faixa de regiões do corpo, grade de fichas altas; visualizador em diálogo com a ficha à esquerda e os dados à direita. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#e6eaf1; --line:#d3d9e4;
  --ink:#0d1a3a; --muted:#56617a; --accent:#e8590c; --accent-ink:#ffffff;
  --navy:#0b2a6b; --ok:#1c7c54; --star:#c98a00; --stage:#0a1126;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1022; --surface:#121a33; --sunken:#0d1429; --line:#263257;
  --ink:#e9edf7; --muted:#9aa6c4; --accent:#ff7a2f; --accent-ink:#1a0d02;
  --navy:#8fb0ff; --ok:#4fc393; --star:#f2bd3b; --stage:#050916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1022; --surface:#121a33; --sunken:#0d1429; --line:#263257;
  --ink:#e9edf7; --muted:#9aa6c4; --accent:#ff7a2f; --accent-ink:#1a0d02;
  --navy:#8fb0ff; --ok:#4fc393; --star:#f2bd3b; --stage:#050916; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:12px}
.brand{flex:1 1 220px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.search{flex:2 1 260px;min-width:0;position:relative}
.search input{width:100%;height:42px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:13px;top:13px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.prog{flex:0 1 210px;min-width:150px}
.prog b{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.prog span{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--sunken);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}

.filters{display:flex;flex-direction:column;gap:12px;padding-block:16px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;display:inline-flex;gap:8px;align-items:baseline;font-weight:500}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.row select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}
.row label{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.tog input{width:16px;height:16px;accent-color:var(--accent)}
.count{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px;padding-block:8px 48px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile .pic{border:0;padding:0;background:var(--sunken);display:block;position:relative;aspect-ratio:9/19;width:100%;overflow:hidden}
.tile .pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tile.done .pic img{opacity:.55}
.tile .rep{position:absolute;right:6px;bottom:6px;background:var(--stage);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px}
.tile .meta{padding:8px 10px 4px;display:flex;gap:8px;align-items:flex-start;min-width:0}
.num{font-family:var(--display);font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 5px;font-variant-numeric:tabular-nums;flex:none}
.tile .nm{font-weight:600;font-size:14px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.tile .rg{padding:0 10px;color:var(--muted);font-size:12px}
.tile .acts{display:flex;gap:4px;padding:4px 6px 6px;margin-top:auto}
.ib{border:0;background:none;border-radius:6px;padding:6px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.ib:hover{background:var(--sunken)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ib.fav[aria-pressed="true"]{color:var(--star)} .ib.fav[aria-pressed="true"] svg{fill:currentColor}
.ib.chk[aria-pressed="true"]{color:var(--ok);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 0}
.empty button{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:12px;width:min(980px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:hidden}
dialog::backdrop{background:rgba(5,9,22,.72)}
.view{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:min(860px,calc(100dvh - 24px))}
.stage{background:var(--stage);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px;min-height:0}
.stage img{width:100%;max-width:440px;height:auto;display:block;border-radius:4px;cursor:zoom-in}
.stage.zoom{justify-content:flex-start}
.stage.zoom img{width:auto;max-width:none;cursor:zoom-out}
.stage .hdtag{position:absolute;left:12px;bottom:12px;background:rgba(5,9,22,.8);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;pointer-events:none}
.stage{position:relative}
.side{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.side .hd{display:flex;gap:10px;align-items:flex-start}
.side .num{font-size:22px;padding:1px 8px}
.side h2{font-family:var(--display);font-size:clamp(20px,2vw,24px);line-height:1.05;margin:0;text-transform:uppercase;font-weight:700;text-wrap:balance;overflow-wrap:break-word;hyphens:auto;min-width:0}
.x{margin-left:auto;flex:none}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
dt{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;padding-top:3px}
dd{margin:0}
.txt{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.txt h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.txt dl{display:flex;flex-direction:column;gap:2px}
.txt dt+dd+dt{margin-top:10px}
.txt dt{color:var(--accent);font-family:var(--display);font-size:14px;letter-spacing:.04em;font-weight:700;padding:0}
.txt dd{font-size:15px;line-height:1.4;margin-top:1px}
.txt sup{color:var(--accent);font-weight:700;margin-left:2px}
.txt .rec{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.big{display:flex;gap:8px;flex-wrap:wrap}
.big .ib{border:1px solid var(--line);padding:8px 12px;color:var(--ink)}
.sib h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.sib div{display:flex;flex-wrap:wrap;gap:6px}
.sib button{border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:4px 8px;font-size:13px;text-align:left}
.nav{display:flex;gap:8px;margin-top:auto;align-items:center}
.nav button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px}
.nav span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:720px){
  dialog{overflow:auto}
  .view{grid-template-columns:1fr;grid-template-rows:none;height:auto}
  header.top{position:static}
  .stage{max-height:62dvh}
  .brand h1{font-size:22px}
  .count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Mapas de Anatomia Palpatória</h1><p id="sub">120 fichas</p></div>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Buscar por músculo, região ou número" aria-label="Buscar fichas" autocomplete="off">
  </div>
  <div class="prog"><b id="pn">0</b> <span>de 120 estudadas</span><div class="bar"><i id="pb"></i></div></div>
</div></header>

<main class="wrap">
  <section class="filters" aria-label="Filtros">
    <div class="chips" id="regs"></div>
    <div class="row">
      <div class="seg" id="mode" role="group" aria-label="Mostrar">
        <button data-m="all" aria-pressed="true">Todas</button>
        <button data-m="todo" aria-pressed="false">A estudar</button>
        <button data-m="done" aria-pressed="false">Estudadas</button>
        <button data-m="fav" aria-pressed="false">Favoritas</button>
      </div>
      <label>Plano
        <select id="plano">
          <option value="">Todos</option><option value="s">Superficial</option><option value="i">Intermediário</option>
          <option value="p">Profundo</option><option value="o">Posterior</option><option value="-">Sem plano indicado</option>
        </select></label>
      <label>Ordem
        <select id="ord"><option value="n">Número da ficha</option><option value="a">Nome (A–Z)</option></select></label>
      <label class="tog"><input type="checkbox" id="grp"> Juntar fichas repetidas</label>
      <span class="count" id="cnt"></span>
    </div>
  </section>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<dialog id="dlg" aria-labelledby="vn" lang="pt-BR">
  <div class="view">
    <div class="stage" id="stage"><img id="vi" alt=""><span class="hdtag" id="hdt" hidden></span></div>
    <div class="side">
      <div class="hd"><span class="num" id="vnum"></span><h2 id="vn"></h2>
        <button class="ib x" id="vx" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <dl><dt>Região</dt><dd id="vr"></dd><dt>Plano</dt><dd id="vp"></dd><dt>Página</dt><dd id="vpg"></dd></dl>
      <p class="note" id="vnote" hidden></p>
      <section class="txt" id="vt" aria-label="Texto da ficha"></section>
      <div class="big">
        <button class="ib chk" id="vdone" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg><span></span></button>
        <button class="ib fav" id="vfav" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.9l6-.9z"/></svg><span></span></button>
      </div>
      <div class="sib" id="vsib" hidden><h3>Outras fichas deste músculo</h3><div></div></div>
      <p class="note">O texto da ficha está transcrito acima. Clique em qualquer ponto da imagem para ampliar. Use as setas do teclado para trocar de ficha.</p>
      <div class="nav"><button id="vprev">← Anterior</button><span id="vpos"></span><button id="vnext">Próxima →</button></div>
    </div>
  </div>
</dialog>

 ao 5º)","f":"Flexão das articulações interfalângicas proximais (2º ao 5º)","r":"Úmero e ulna","p":"Terço médio do antebraço, face anterior","c":"Importante para força de preensão e movimentos de flexão dos dedos"},"108":{"o":"Face anterior da ulna e membrana interóssea","i":"Bases das falanges distais (2º ao 5º)","f":"Flexão das articulações interfalângicas distais (2º ao 5º)","r":"Ulna e membrana interóssea","p":"Terço distal do antebraço, face anterior","c":"Essencial para força de preensão fina e movimentos de pinça"},"109":{"o":"Face anterior do rádio e membrana interóssea","i":"Base da falange distal do polegar","f":"Flexão do polegar (IFD)","r":"Rádio e membrana interóssea","p":"Terço distal do antebraço, face anterior","c":"Importante para movimentos de pinça e flexão fina do polegar"},"110":{"o":"Face anterior da ulna (terço distal)","i":"Face anterior do rádio (terço distal)","f":"Pronação do antebraço","r":"Ulna e rádio","p":"Região distal do antebraço, face anterior","c":"Importante para movimentos de pronação e estabilização da articulação radioulnar distal"},"111":{"o":"Face anterior do rádio e membrana interóssea","i":"Base da falange média do 5º dedo","f":"Flexão do 5º dedo (articulação PIP) e auxílio na flexão da MCP","r":"Rádio, ulna e membrana interóssea","p":"Terço médio do antebraço, medial ao flexor superficial dos dedos","c":"Importante para movimentos de preensão e estabilização do 5º dedo"},"112":{"o":"Osso pisiforme e retináculo dos flexores","i":"Base da falange proximal do 5º dedo (lado ulnar)","f":"Abdução do 5º dedo","r":"Pisiforme, 5º metacarpo","p":"Região ulnar da palma da mão","c":"Importante para a abdução do 5º dedo e movimentos de preensão"},"113":{"o":"Hâmulo do hamato e retináculo dos flexores","i":"Base da falange proximal do 5º dedo (lado ulnar)","f":"Flexão do 5º dedo (MCP)","r":"Hâmulo do hamato, 5º metacarpo","p":"Região ulnar da palma, profundo ao abdutor do dedo mínimo","c":"Auxilia na preensão e na flexão da MCP do 5º dedo"},"114":{"o":"Hâmulo do hamato e retináculo dos flexores","i":"Borda medial do 5º metacarpo","f":"Oposição do 5º dedo","r":"Hâmulo do hamato, 5º metacarpo","p":"Região ulnar da palma, profundo aos músculos hipotenares","c":"Importante para movimentos de oposição e pinça de precisão"},"115":{"o":"Tendões do flexor profundo dos dedos (1º ao 4º dedo)","i":"Expansões extensoras (2º ao 5º dedo)","f":"Flexão das MCP e extensão das IFP e IFD","r":"Tendões do flexor profundo","p":"Região palmar, entre os tendões","c":"Importantes para movimentos finos, escrita e preensão de precisão"},"116":{"o":"Faces palmares dos metacarpos (1º, 3º e 5º)","i":"Expansões extensoras (2º, 4º e 5º dedos)","f":"Adução dos dedos (em relação ao 3º dedo)","r":"Metacarpos e expansões extensoras","p":"Espaços intermetacárpicos (face palmar)","c":"Importantes para a adução dos dedos e movimentos de preensão"},"117":{"o":"Faces adjacentes dos metacarpos (1º ao 4º)","i":"Expansões extensoras (2º ao 5º dedos)","f":"Abdução dos dedos (em relação ao 3º dedo)","r":"Metacarpos e expansões extensoras","p":"Espaços intermetacárpicos (face dorsal)","c":"Importantes para a abdução dos dedos e estabilização da mão"},"118":{"o":"Bases do 2º e 3º metacarpos e hamato","i":"Base da falange proximal do polegar (lado ulnar)","f":"Adução do polegar","r":"2º e 3º metacarpos, hamato","p":"Região palmar, profunda ao 1º metacarpo","c":"Importante para a força de pinça e estabilização do polegar"},"119":{"o":"Retináculo dos flexores e trapézio (cabo superficial); trapezoide/capitato (cabo profundo)","i":"Base da falange proximal do polegar","f":"Flexão do polegar (MCP)","r":"Trapézio, trapezoide, capitato","p":"Região palmar, na base do polegar","c":"Importante para a flexão do polegar e movimentos de pinça"},"120":{"o":"Retináculo dos flexores e osso trapézio","i":"Borda lateral do 1º metacarpo","f":"Oposição do polegar","r":"Trapézio e 1º metacarpo","p":"Região tenar, lateral ao flexor curto","c":"Essencial para a oposição e pinça de precisão"}};
const LBL=[["fg","Função geral"],["o","Origem"],["i","Inserção"],["f","Função"],["inerv","Inervação"],["irrig","Irrigação"],["est","Estruturas principais"],["r","Referências ósseas"],["p","Ponto de palpação"],["c","Aplicação clínica"],["imp","Importância clínica"],["pos","Posicionamento do paciente"],["mov","Movimento para confirmação"]];
const ALIAS={"Interósseos dorsais da mão":"Interósseos dorsais","Interósseos palmares da mão":"Interósseos palmares","Pronador teres":"Pronador redondo","Extensores dos dedos (2º ao 5º)":"Extensor dos dedos"};
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const pad=n=>String(n).padStart(3,"0");
const CARDS=RAW.split("\n").map((l,i)=>{const[name,r,p,note]=l.split("|");const n=i+1;
  return{n,name,regs:[...r],p:p||"",note:note||"",key:norm(ALIAS[name]||name),src:"cards/"+pad(n)+".webp",hd:"hd/"+pad(n)+".webp",
    hay:norm(name+" "+Object.values(TXT[n]||{}).filter(v=>typeof v==="string").join(" ")+" "+[...r].map(c=>REG[c]).join(" ")+" "+(PL[p]||"")+" "+n+" "+pad(n))}});
const BY={};CARDS.forEach(c=>(BY[c.key]=BY[c.key]||[]).push(c));
const $=id=>document.getElementById(id);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3.5l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.9l6-.9z"/></svg>';
const CHK='<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';

/* estado */
const S={q:"",reg:"",mode:"all",plano:"",ord:"n",grp:false,fav:new Set(),done:new Set()};
let list=[],cur=-1,ref=null,saving=false,dirty=false,timer=0;
const LS="mapas-palpatoria-v1";
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||"{}");(d.fav||[]).forEach(n=>S.fav.add(n));(d.done||[]).forEach(n=>S.done.add(n))}catch(e){}}
function persist(){const d={fav:[...S.fav].sort((a,b)=>a-b),done:[...S.done].sort((a,b)=>a-b)};
  try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}
  if(ref){dirty=true;clearTimeout(timer);timer=setTimeout(flush,900)}}
async function flush(){if(!ref||saving||!dirty)return;saving=true;dirty=false;
  try{await ref.set({fav:[...S.fav],done:[...S.done]})}catch(e){}
  saving=false;if(dirty)flush()}
async function connect(){try{
  if(!window.claude||!window.claude.use)return;
  const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const r=db.doc("data/users/"+id+"/progresso");const snap=await r.get();
  const d=snap.exists?(snap.data()||{}):{};const f0=S.fav.size,d0=S.done.size;
  (d.fav||[]).forEach(n=>S.fav.add(n));(d.done||[]).forEach(n=>S.done.add(n));
  ref=r;if(S.fav.size!==(d.fav||[]).length||S.done.size!==(d.done||[]).length)persist();
  if(S.fav.size!==f0||S.done.size!==d0)render();
}catch(e){}}

/* filtros */
function match(c){
  if(S.reg&&!c.regs.includes(S.reg))return false;
  if(S.plano&&(S.plano==="-"?c.p!=="":c.p!==S.plano))return false;
  if(S.mode==="fav"&&!S.fav.has(c.n))return false;
  if(S.mode==="done"&&!S.done.has(c.n))return false;
  if(S.mode==="todo"&&S.done.has(c.n))return false;
  if(S.q){const t=norm(S.q).split(/\s+/).filter(Boolean);if(!t.every(w=>c.hay.includes(w)))return false}
  return true}
function chips(){const box=$("regs");box.textContent="";
  const add=(code,label,n)=>{const b=el("button","chip");b.type="button";b.setAttribute("aria-pressed",String(S.reg===code));
    b.append(label," ",el("small",null,n));b.onclick=()=>{S.reg=code;render()};box.append(b)};
  add("","Todas as regiões",CARDS.length);
  Object.keys(REG).forEach(k=>add(k,REG[k],CARDS.filter(c=>c.regs.includes(k)).length))}
function render(){
  chips();
  let hits=CARDS.filter(match);
  const sorter=S.ord==="a"?(a,b)=>a.name.localeCompare(b.name,"pt")||a.n-b.n:(a,b)=>a.n-b.n;
  hits.sort(sorter);list=hits;
  const g=$("grid");g.textContent="";
  let shown=hits,groups=null;
  if(S.grp){groups=new Map();hits.forEach(c=>{if(!groups.has(c.key))groups.set(c.key,[]);groups.get(c.key).push(c)});shown=[...groups.values()].map(a=>a[0])}
  if(!shown.length){const e=el("div","empty");e.append(el("div",null,"Nenhuma ficha corresponde a esses filtros."));
    const b=el("button",null,"Limpar filtros");b.onclick=reset;e.append(b);g.append(e)}
  const frag=document.createDocumentFragment();
  shown.forEach(c=>{const t=el("article","tile"+(S.done.has(c.n)?" done":""));
    const pic=el("button","pic");pic.type="button";pic.setAttribute("aria-label","Abrir ficha "+c.n+", "+c.name);
    const im=el("img");im.loading="lazy";im.decoding="async";im.src=c.src;im.alt="";im.width=260;im.height=600;pic.append(im);
    const reps=groups?groups.get(c.key).length:0;if(reps>1)pic.append(el("span","rep",reps+" fichas"));
    pic.onclick=()=>open(c.n);
    const m=el("div","meta");m.append(el("span","num",pad(c.n).slice(c.n>99?0:1)),el("span","nm",c.name));
    const rg=el("div","rg",c.regs.map(r=>REG[r]).join(" · ")+(c.p?" · "+PL[c.p].toLowerCase():""));
    const a=el("div","acts");
    const k=el("button","ib chk");k.type="button";k.innerHTML=CHK;k.append(el("span",null,S.done.has(c.n)?"Estudada":"Marcar"));
    k.setAttribute("aria-pressed",String(S.done.has(c.n)));k.setAttribute("aria-label",(S.done.has(c.n)?"Desmarcar":"Marcar")+" ficha "+c.n+" como estudada");
    k.onclick=()=>toggle("done",c.n);
    const f=el("button","ib fav");f.type="button";f.innerHTML=STAR;f.style.marginLeft="auto";
    f.setAttribute("aria-pressed",String(S.fav.has(c.n)));f.setAttribute("aria-label",(S.fav.has(c.n)?"Tirar dos":"Pôr nos")+" favoritos: ficha "+c.n);
    f.onclick=()=>toggle("fav",c.n);
    a.append(k,f);t.append(pic,m,rg,a);frag.append(t)});
  g.append(frag);
  $("cnt").textContent=S.grp?shown.length+" músculos · "+hits.length+" fichas":hits.length+(hits.length===1?" ficha":" fichas");
  $("pn").textContent=S.done.size;$("pb").style.width=(S.done.size/CARDS.length*100)+"%";
  $("sub").textContent="120 fichas · "+Object.keys(BY).length+" músculos e visões gerais · "+S.fav.size+" favoritas";
  [...$("mode").children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===S.mode)));
}
function reset(){S.q="";S.reg="";S.mode="all";S.plano="";$("q").value="";$("plano").value="";render()}
function toggle(kind,n){const set=S[kind];set.has(n)?set.delete(n):set.add(n);persist();const y=window.scrollY;render();window.scrollTo(0,y);if($("dlg").open)paint()}

/* visualizador */
function open(n){let i=list.findIndex(c=>c.n===n);if(i<0){list=CARDS.slice();i=n-1}cur=i;paint();if(!$("dlg").open)$("dlg").showModal()}
function paintText(c){const box=$("vt"),t=TXT[c.n]||{};box.textContent="";
  box.append(el("h3",null,"Texto da ficha"));const dl=el("dl");let any=false;
  LBL.forEach(([k,lab])=>{if(!t[k])return;const dt=el("dt",null,lab);const dd=el("dd",null,t[k]);
    if((t.rec||[]).includes(k)){dd.append(el("sup",null,"*"));any=true}dl.append(dt,dd)});
  box.append(dl);if(any)box.append(el("p","rec","* Trecho ilegível ou com erro de impressão na ficha original; texto completado com a descrição anatômica correspondente."))}
function paint(){const c=list[cur];if(!c)return;paintText(c);
  $("stage").classList.remove("zoom");$("stage").scrollTo(0,0);
  $("vi").src=c.src;$("vi").alt="Ficha "+c.n+": "+c.name;$("hdt").textContent="Carregando alta resolução…";$("hdt").hidden=false;
  const want=c.n,hi=new Image();hi.onload=()=>{if(list[cur]&&list[cur].n===want){$("vi").src=c.hd;$("hdt").hidden=true}};hi.src=c.hd;
  $("vnum").textContent=pad(c.n).slice(c.n>99?0:1);$("vn").textContent=c.name;
  $("vr").textContent=c.regs.map(r=>REG[r]).join(" e ");$("vp").textContent=PL[c.p];
  $("vpg").textContent=(Math.ceil(c.n/10))+" de 12 do PDF original";
  $("vnote").hidden=!c.note;$("vnote").textContent=c.note;
  const d=S.done.has(c.n),f=S.fav.has(c.n);
  $("vdone").setAttribute("aria-pressed",String(d));$("vdone").lastElementChild.textContent=d?"Estudada":"Marcar como estudada";
  $("vfav").setAttribute("aria-pressed",String(f));$("vfav").lastElementChild.textContent=f?"Nos favoritos":"Favoritar";
  const sib=BY[c.key].filter(x=>x.n!==c.n),box=$("vsib").lastElementChild;box.textContent="";$("vsib").hidden=!sib.length;
  sib.forEach(x=>{const b=el("button",null,"Ficha "+x.n+(x.p?" · "+PL[x.p].toLowerCase():"")+(x.name!==c.name?" · "+x.name:""));b.type="button";b.onclick=()=>open(x.n);box.append(b)});
  $("vpos").textContent=(cur+1)+" / "+list.length;
  $("vprev").disabled=cur<=0;$("vnext").disabled=cur>=list.length-1}
function step(d){const i=cur+d;if(i>=0&&i<list.length){cur=i;paint()}}
$("vprev").onclick=()=>step(-1);$("vnext").onclick=()=>step(1);$("vx").onclick=()=>$("dlg").close();
$("vdone").onclick=()=>toggle("done",list[cur].n);$("vfav").onclick=()=>toggle("fav",list[cur].n);
$("vi").onclick=e=>{const st=$("stage"),im=$("vi"),r=im.getBoundingClientRect();
  const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
  st.classList.toggle("zoom");
  if(st.classList.contains("zoom")){requestAnimationFrame(()=>{const p=st.getBoundingClientRect();
    st.scrollLeft=im.offsetWidth*fx-p.width/2+12;st.scrollTop=im.offsetHeight*fy-p.height/2+12})}};
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
document.addEventListener("keydown",e=>{if(!$("dlg").open)return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});

$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("plano").onchange=e=>{S.plano=e.target.value;render()};
$("ord").onchange=e=>{S.ord=e.target.value;render()};
$("grp").onchange=e=>{S.grp=e.target.checked;render()};
$("mode").onclick=e=>{const b=e.target.closest("button");if(b){S.mode=b.dataset.m;render()}};

loadLocal();render();connect();
const h=/^#f(\d{1,3})$/.exec(location.hash||"");if(h&&+h[1]>=1&&+h[1]<=120)open(+h[1]);
</script>
